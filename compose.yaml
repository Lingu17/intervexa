services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: intervexa
      POSTGRES_USER: intervexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - intervexa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervexa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  intervexa_db:
