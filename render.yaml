# Backend only. Deploy the repository-root Next.js frontend on Vercel.
services:
  - type: web
    name: intervexa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: ENVIRONMENT
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY_PATH
        value: /etc/secrets/github-app.pem
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_LOGIN_CLIENT_ID
        sync: false
      - key: GITHUB_LOGIN_CLIENT_SECRET
        sync: false
      - key: GITHUB_PUBLISH_CHECKS
        value: "false"
